<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicFix - Bengaluru Civic Issue Reporter</title>
    <!-- Prevent flash of unstyled theme by applying data-theme immediately from localStorage / OS preference -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("civicfix_theme");
          var valid = ["light", "dark", "ocean", "sunset"];
          if (saved && valid.indexOf(saved) !== -1) {
            document.documentElement.setAttribute("data-theme", saved);
          } else {
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute(
              "data-theme",
              prefersDark ? "dark" : "light"
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
